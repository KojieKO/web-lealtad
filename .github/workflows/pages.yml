name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generar contenidos desde Markdown
        run: |
          python scripts/generar_agenda.py
          python scripts/generar_obras_pictoricas.py
          python scripts/generar_hermandad.py
      - name: Guardar las copias generadas
        run: |
          if ! git diff --quiet -- agenda.html hermandad.html assets/agenda-datos.js assets/obras-pictoricas-datos.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agenda.html hermandad.html assets/agenda-datos.js assets/obras-pictoricas-datos.js
            git commit -m "chore: actualizar contenidos generados [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
